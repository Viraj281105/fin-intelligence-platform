services:
  # Financial SLM FastAPI Service
  fin-slm-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fin_slm_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql://fin_admin:fin_secret_password@postgres:5432/fin_warehouse
      - VECTOR_DB_URL=http://qdrant:6333
    volumes:
      - ../models:/app/models
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Relational Financial Data Warehouse
  postgres:
    image: postgres:16-alpine
    container_name: fin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fin_admin
      POSTGRES_PASSWORD: fin_secret_password
      POSTGRES_DB: fin_warehouse
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin_admin -d fin_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vector Database for Financial RAG
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: fin_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pg_data:
  qdrant_data:
