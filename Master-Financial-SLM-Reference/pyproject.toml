[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-intelligence-platform"
version = "0.2.0"
description = "Enterprise-Grade Financial Small Language Model (SLM) & Intelligence Platform"
authors = [{ name = "Viraj Jadhao" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",
    "trl>=0.11.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlglot>=25.0.0",
    "sqlalchemy>=2.0.0",
    "duckdb>=1.0.0",
    "qdrant-client>=1.11.0",
    "sentence-transformers>=3.1.0",
    "rank-bm25>=0.2.2",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "rich>=13.8.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
train = [
    "wandb>=0.17.0",
    "tensorboard>=2.17.0",
    "deepspeed>=0.15.0; sys_platform != 'win32'",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
fin-slm = "src.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
